[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgent-core"
version = "0.1.0"
description = "Pre-release agent runtime kernel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["edgent_core*"]
